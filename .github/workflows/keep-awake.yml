name: Keep Render awake
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping
        run: curl -fsS --max-time 120 https://bing-keyword-pro.onrender.com/api/markets -o /dev/null && echo ok || echo "ping failed"
